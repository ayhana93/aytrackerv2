name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # Fast feedback: formatting, lint and types fail in under a minute and need no database.
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client types are needed before anything typechecks.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - run: pnpm build
      - run: pnpm test

  # Integration tests run against a real PostgreSQL. The invariants under test — partial unique
  # indexes, composite tenant foreign keys, transaction atomicity — do not exist in a mock.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aytracker
          POSTGRES_PASSWORD: aytracker
          POSTGRES_DB: aytracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://aytracker:aytracker@localhost:5432/aytracker_test?schema=public
      TEST_DATABASE_URL: postgresql://aytracker:aytracker@localhost:5432/aytracker_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Proves the migrations produce exactly the schema, with no drift between the two.
      - name: Verify no schema drift
        run: pnpm --filter @aytracker/database migrate:status

      - run: pnpm test:integration

      # `SEED_DEMO` on purpose. Without it the seed takes the platform-reference path and returns
      # before touching a tenant, so the step passed for a month while the demo path was broken
      # against a schema change it had never been updated for. A step that verifies the half that
      # cannot break is not verification.
      - name: Verify the seed runs
        run: pnpm db:seed
        env:
          SEED_DEMO: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
